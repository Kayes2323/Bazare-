<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সব পণ্য — Bazare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .listing-layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; max-width: 1280px; margin: 0 auto; padding: 24px; }

    /* Filter Sidebar */
    .filter-sidebar { position: sticky; top: 88px; height: fit-content; background: white; border-radius: 16px; border: 1px solid var(--gray-100); box-shadow: var(--shadow-xs); padding: 20px; }
    .filter-title { font-family: var(--font-heading); font-size: 16px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .filter-clear { font-size: 12px; font-weight: 600; color: var(--green); cursor: pointer; }
    .filter-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--gray-100); }
    .filter-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .filter-section-title { font-size: 13px; font-weight: 700; color: var(--gray-700); margin-bottom: 12px; }
    .filter-check { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; font-size: 14px; color: var(--gray-700); transition: color 0.15s; }
    .filter-check:hover { color: var(--green); }
    .filter-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
    .filter-count { margin-left: auto; font-size: 11px; color: var(--gray-400); font-weight: 600; }
    .price-range { display: flex; gap: 8px; align-items: center; }
    .price-input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 13px; font-family: var(--font-body); outline: none; }
    .price-input:focus { border-color: var(--green); }
    .star-filter { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
    .star-filter:hover { opacity: 0.8; }

    /* Products area */
    .listing-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .listing-count { font-size: 15px; color: var(--gray-600); font-weight: 500; }
    .listing-count strong { color: var(--black); font-weight: 700; }
    .sort-select { padding: 8px 14px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 14px; font-family: var(--font-body); outline: none; cursor: pointer; background: white; }
    .sort-select:focus { border-color: var(--green); }

    .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    /* Active filter tags */
    .active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filter-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--green-pale); color: var(--green); border-radius: 99px; padding: 5px 12px; font-size: 12px; font-weight: 600; }
    .filter-tag button { background: none; border: none; cursor: pointer; color: var(--green); font-size: 14px; line-height: 1; padding: 0; }

    /* Pagination */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 36px; }
    .page-btn { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--gray-200); background: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
    .page-btn:hover, .page-btn.active { background: var(--green); color: white; border-color: var(--green); }

    /* Mobile filter button */
    .mobile-filter-btn { display: none; }

    /* Empty */
    .empty-products { text-align: center; padding: 80px 20px; color: var(--gray-400); grid-column: 1/-1; }
    .empty-products-icon { font-size: 60px; margin-bottom: 16px; }

    /* Skeleton */
    .skeleton-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid var(--gray-100); }
    .skeleton-img { aspect-ratio: 1; background: linear-gradient(90deg, #edf2ef 25%, #dce8e0 50%, #edf2ef 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .skeleton-body { padding: 14px; }
    .skeleton-line { height: 12px; background: linear-gradient(90deg, #edf2ef 25%, #dce8e0 50%, #edf2ef 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; margin-bottom: 10px; }
    .skeleton-line.short { width: 60%; }

    @media (max-width: 1024px) { .products-grid { grid-template-columns: repeat(2,1fr); } }
    /* Filter overlay backdrop */
    .filter-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 799;
    }
    .filter-overlay.show { display: block; }

    @media (max-width: 768px) {
      body { padding-bottom: 70px; }

      /* Navbar fix */
      #nav-become-seller,
      #nav-seller-link,
      #nav-admin-link { display: none !important; }

      /* Layout */
      .listing-layout { grid-template-columns: 1fr; padding: 12px 16px; gap: 0; }

      /* Filter sidebar — slide up from bottom on mobile */
      .filter-sidebar {
        display: none;
        position: fixed;
        bottom: 64px; left: 0; right: 0;
        max-height: 80vh;
        z-index: 800;
        border-radius: 20px 20px 0 0;
        overflow-y: auto;
        padding: 20px;
        box-shadow: 0 -8px 32px rgba(0,0,0,0.15);
      }
      .filter-sidebar.mobile-open { display: block; }
      .mobile-filter-btn { display: flex !important; }

      /* Products */
      .products-grid { grid-template-columns: repeat(2,1fr); gap: 10px; }

      /* Listing header */
      .listing-header { margin-bottom: 12px; }
      .listing-count { font-size: 13px; }
      .sort-select { font-size: 13px; padding: 7px 10px; }

      /* Pagination */
      .page-btn { width: 36px; height: 36px; font-size: 13px; }
    }

    @media (max-width: 480px) {
      .products-grid { grid-template-columns: repeat(2,1fr); gap: 8px; }
      .listing-layout { padding: 10px 12px; }
    }
  </style>
</head>

<script>
let allProducts = [];
const emojiBg = {'👗':'#fce7f3','🌿':'#d1fae5','🧴':'#fef3c7','🌸':'#ede9fe','🥚':'#fef3c7','🦜':'#dbeafe','🍯':'#ffedd5','🧶':'#fce7f3','🪴':'#d1fae5','🎁':'#fee2e2'};

// Read URL params
const urlParams = new URLSearchParams(window.location.search);
const urlCat   = urlParams.get('cat');
const urlQ     = urlParams.get('q');

document.addEventListener('DOMContentLoaded', async () => {
  // Set search box
  if (urlQ) document.getElementById('main-search').value = urlQ;

  // Pre-check category from URL
  if (urlCat) {
    document.querySelectorAll('.filter-check input').forEach(cb => {
      if (cb.value === urlCat) cb.checked = true;
    });
  }

  await loadProducts();
});

async function loadProducts() {
  try {
    const snap = await db.collection(COL.PRODUCTS).where('status','==','active').orderBy('createdAt','desc').get();
    allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    applyFilters();
  } catch(e) {
    document.getElementById('products-grid').innerHTML = `<div class="empty-products"><div class="empty-products-icon">😕</div><p>পণ্য লোড করতে সমস্যা হয়েছে।</p></div>`;
  }
}

function applyFilters() {
  let products = [...allProducts];

  // Search query
  const q = urlQ || document.getElementById('main-search')?.value?.toLowerCase() || '';
  if (q) products = products.filter(p => p.name?.toLowerCase().includes(q) || p.category?.toLowerCase().includes(q) || p.description?.toLowerCase().includes(q));

  // Category
  const cats = Array.from(document.querySelectorAll('.filter-check input:checked')).map(c => c.value);
  if (cats.length) products = products.filter(p => cats.includes(p.category));

  // Price
  const minP = parseFloat(document.getElementById('price-min')?.value) || 0;
  const maxP = parseFloat(document.getElementById('price-max')?.value) || Infinity;
  products = products.filter(p => p.price >= minP && p.price <= maxP);

  // Rating
  const ratingVal = document.querySelector('input[name="rating"]:checked')?.value;
  if (ratingVal && ratingVal !== '0') products = products.filter(p => (p.rating || 0) >= parseFloat(ratingVal));

  // Sort
  const sort = document.getElementById('sort-select')?.value || 'new';
  if (sort === 'price-asc')  products.sort((a,b) => a.price - b.price);
  if (sort === 'price-desc') products.sort((a,b) => b.price - a.price);
  if (sort === 'popular')    products.sort((a,b) => (b.sold||0) - (a.sold||0));

  renderProducts(products);
  updateActiveFilterTags(cats, q);
}

function renderProducts(products) {
  const grid = document.getElementById('products-grid');
  document.getElementById('listing-count').innerHTML = `<strong>${products.length}টি</strong> পণ্য পাওয়া গেছে`;

  if (!products.length) {
    grid.innerHTML = `<div class="empty-products"><div class="empty-products-icon">🔍</div><h3>কোনো পণ্য পাওয়া যায়নি</h3><p>অন্য keyword বা filter দিয়ে চেষ্টা করুন</p><button class="btn btn-outline btn-md" style="margin-top:16px;" onclick="clearFilters()">Filter মুছুন</button></div>`;
    return;
  }

  grid.innerHTML = '';
  products.forEach((p, i) => {
    const bg = p.imageUrl ? '' : (emojiBg[p.emoji] || '#e8f5ed');
    const imgHtml = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy">` : `<span style="font-size:64px;">${p.emoji||'📦'}</span>`;
    const oldPrice = p.originalPrice ? `<span class="price-old">৳${p.originalPrice.toLocaleString('bn')}</span>` : '';
    const badge = p.badge ? `<span class="product-badge badge-${p.badge.type}">${p.badge.label}</span>` : '';
    const stars = '★'.repeat(Math.round(p.rating||5)) + '☆'.repeat(5-Math.round(p.rating||5));

    grid.innerHTML += `
    <div class="product-card" style="animation:fadeUp 0.4s ease ${i*0.04}s both;" onclick="window.location='product.html?id=${p.id}'">
      <div class="product-img-wrap" style="background:${bg};">
        ${imgHtml}
        ${badge}
        <button class="product-wishlist" onclick="event.stopPropagation();toggleWishlist(this,'${p.id}')">🤍</button>
      </div>
      <div class="product-body">
        <div class="product-seller"><span class="seller-tick">✓</span> ${p.sellerName||'Bazare Seller'}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-rating"><span class="stars" style="color:var(--accent);">${stars}</span><span class="rating-count">(${p.reviewCount||0})</span></div>
        <div class="product-footer">
          <div class="product-prices">${oldPrice}<span class="price-new">৳${p.price.toLocaleString('bn')}</span></div>
          <button class="add-cart-btn" onclick="event.stopPropagation();addToCart({id:'${p.id}',name:'${p.name.replace(/'/g,"\\'")}',price:${p.price},imageUrl:'${p.imageUrl||''}',emoji:'${p.emoji||'📦'}'},this)">+ কার্ট</button>
        </div>
      </div>
    </div>`;
  });
}

function updateActiveFilterTags(cats, q) {
  const container = document.getElementById('active-filters');
  container.innerHTML = '';
  if (q) container.innerHTML += `<div class="filter-tag">"${q}" <button onclick="clearSearch()">✕</button></div>`;
  cats.forEach(cat => {
    container.innerHTML += `<div class="filter-tag">${cat} <button onclick="removeCatFilter('${cat}')">✕</button></div>`;
  });
}

function clearFilters() {
  document.querySelectorAll('.filter-check input').forEach(c => c.checked = false);
  document.getElementById('price-min').value = '';
  document.getElementById('price-max').value = '';
  document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);
  history.replaceState(null, '', 'listing.html');
  applyFilters();
}

function clearSearch() {
  document.getElementById('main-search').value = '';
  history.replaceState(null, '', 'listing.html');
  window.location.reload();
}

function removeCatFilter(cat) {
  document.querySelectorAll('.filter-check input').forEach(c => { if (c.value === cat) c.checked = false; });
  applyFilters();
}

function toggleWishlist(btn, id) {
  requireAuth(() => { btn.classList.toggle('liked'); btn.textContent = btn.classList.contains('liked') ? '❤️' : '🤍'; });
}

function doSearch() {
  const q = document.getElementById('main-search').value.trim();
  if (q) window.location.href = `listing.html?q=${encodeURIComponent(q)}`;
}

function toggleMobileFilter() {
  document.getElementById('filter-sidebar').classList.toggle('mobile-open');
  document.getElementById('filter-overlay').classList.toggle('show');
  document.body.style.overflow = document.getElementById('filter-sidebar').classList.contains('mobile-open') ? 'hidden' : '';
}
function closeMobileFilter() {
  document.getElementById('filter-sidebar').classList.remove('mobile-open');
  document.getElementById('filter-overlay').classList.remove('show');
  document.body.style.overflow = '';
}
</script>
</body>
</html>
