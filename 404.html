<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Bazare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Hind Siliguri',sans-serif; background:#f7faf8; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .container { text-align:center; max-width:480px; }
    .emoji { font-size:80px; margin-bottom:20px; }
    h1 { font-family:'Sora',sans-serif; font-size:80px; font-weight:900; color:#1a7a3c; line-height:1; margin-bottom:12px; }
    h2 { font-family:'Sora',sans-serif; font-size:24px; font-weight:800; color:#0a1a0f; margin-bottom:12px; }
    p { font-size:16px; color:#5f8a6e; line-height:1.7; margin-bottom:32px; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:14px 32px; background:#1a7a3c; color:white; border-radius:99px; font-size:16px; font-weight:700; text-decoration:none; transition:all 0.2s; }
    .btn:hover { background:#0f5228; transform:translateY(-2px); }
    .btn-outline { background:transparent; color:#1a7a3c; border:2px solid #1a7a3c; margin-left:12px; }
    .btn-outline:hover { background:#e8f5ed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">😕</div>
    <h1>404</h1>
    <h2>পেজ পাওয়া যায়নি</h2>
    <p>আপনি যে পেজটি খুঁজছেন সেটি হয়তো সরানো হয়েছে বা URL ভুল।</p>
    <div>
      <a href="index.html" class="btn">🏠 হোমে ফিরুন</a>
      <a href="listing.html" class="btn btn-outline">🛍️ কেনাকাটা</a>
    </div>
  </div>
</body>
</html>
