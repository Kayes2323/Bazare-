<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার কার্ট — Bazare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-page { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
    .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 24px; align-items: start; }

    .cart-title { font-family: var(--font-heading); font-size: 24px; font-weight: 800; margin-bottom: 20px; }

    /* Cart items */
    .cart-items { background: white; border-radius: 16px; border: 1px solid var(--gray-100); overflow: hidden; }
    .cart-item { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--gray-100); transition: background 0.15s; }
    .cart-item:last-child { border-bottom: none; }
    .cart-item:hover { background: var(--gray-50); }
    .cart-item-img { width: 80px; height: 80px; border-radius: 12px; overflow: hidden; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--black); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item-seller { font-size: 12px; color: var(--gray-400); margin-bottom: 8px; }
    .cart-item-price { font-size: 17px; font-weight: 800; color: var(--green); }
    .cart-item-qty { display: flex; align-items: center; border: 1.5px solid var(--gray-200); border-radius: 8px; overflow: hidden; }
    .qty-btn-sm { width: 32px; height: 32px; border: none; background: var(--gray-50); font-size: 16px; cursor: pointer; transition: background 0.15s; }
    .qty-btn-sm:hover { background: var(--green-pale); }
    .qty-num-sm { width: 36px; text-align: center; font-size: 14px; font-weight: 700; border: none; outline: none; }
    .cart-item-remove { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--gray-300); transition: color 0.15s; padding: 4px; }
    .cart-item-remove:hover { color: var(--red); }

    /* Cart empty */
    .cart-empty { text-align: center; padding: 80px 20px; }
    .cart-empty-icon { font-size: 72px; margin-bottom: 16px; }
    .cart-empty h2 { font-family: var(--font-heading); font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .cart-empty p { font-size: 15px; color: var(--gray-500); margin-bottom: 24px; }

    /* Summary */
    .cart-summary { background: white; border-radius: 16px; border: 1px solid var(--gray-100); padding: 20px; position: sticky; top: 88px; }
    .summary-title { font-family: var(--font-heading); font-size: 17px; font-weight: 800; margin-bottom: 16px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--gray-100); }
    .summary-row:last-of-type { border-bottom: none; }
    .summary-row.total { font-family: var(--font-heading); font-size: 18px; font-weight: 800; color: var(--black); padding-top: 12px; margin-top: 4px; }
    .summary-row.total span:last-child { color: var(--green); }

    /* Coupon */
    .coupon-row { display: flex; gap: 8px; margin: 16px 0; }
    .coupon-input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: 14px; font-family: var(--font-body); outline: none; }
    .coupon-input:focus { border-color: var(--green); }
    .coupon-btn { padding: 10px 16px; background: var(--green); color: white; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font-body); transition: background 0.15s; }
    .coupon-btn:hover { background: var(--green-dark); }

    @media (max-width: 768px) {
      .cart-layout { grid-template-columns: 1fr; }
      .cart-summary { position: static; }
      .cart-page { padding: 16px; padding-bottom: 90px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Bazar<span class="logo-e">e</span></a>
    <div class="nav-search">
      <input type="text" id="main-search" placeholder="পণ্য খুঁজুন..." onkeydown="if(event.key==='Enter')window.location.href='listing.html?q='+encodeURIComponent(this.value)">
      <button class="nav-search-btn" onclick="window.location.href='listing.html?q='+encodeURIComponent(document.getElementById('main-search').value)">🔍 খুঁজুন</button>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary btn-sm" id="nav-login-btn" onclick="showAuthModal()">লগইন</button>
      <div id="nav-user-menu" style="display:none;align-items:center;gap:8px;">
        <button class="user-btn" onclick="toggleUserDropdown()">
          <div class="user-avatar" id="nav-user-avatar">?</div>
          <span class="user-btn-label" id="nav-user-name">আপনি</span>
        </button>
        <div id="user-dropdown" style="display:none;position:absolute;top:72px;right:24px;background:white;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.12);border:1px solid var(--gray-100);min-width:180px;z-index:600;overflow:hidden;">
          <button onclick="logout()" style="display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:var(--red);background:none;border:none;cursor:pointer;width:100%;font-family:var(--font-body);">🚪 লগআউট</button>
        </div>
      </div>
      <a href="cart.html" style="position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px;background:var(--green);border-radius:50%;font-size:20px;text-decoration:none;">
        🛒
        <span class="cart-badge" style="display:none;position:absolute;top:-5px;right:-5px;background:var(--accent);color:#000;border-radius:50%;min-width:20px;height:20px;font-size:11px;font-weight:800;align-items:center;justify-content:center;border:2px solid white;">0</span>
      </a>
    </div>
  </div>
</nav>

<div class="cart-page">
  <div class="cart-title">🛒 আমার কার্ট</div>
  <div class="cart-layout">
    <div>
      <div id="cart-container"></div>
    </div>
    <div class="cart-summary" id="cart-summary" style="display:none;">
      <div class="summary-title">অর্ডার সারসংক্ষেপ</div>
      <div class="summary-row"><span>উপমোট</span><span id="subtotal">৳০</span></div>
      <div class="summary-row"><span>ডেলিভারি চার্জ</span><span id="delivery-fee">৳৬০</span></div>
      <div class="summary-row"><span id="discount-row" style="color:var(--green);display:none;">ছাড়</span><span id="discount-amount" style="color:var(--green);display:none;"></span></div>
      <div class="coupon-row">
        <input type="text" class="coupon-input" id="coupon-input" placeholder="Coupon code">
        <button class="coupon-btn" onclick="applyCoupon()">Apply</button>
      </div>
      <div class="summary-row total"><span>মোট</span><span id="total-amount">৳০</span></div>
      <a href="checkout.html" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:16px;">⚡ Checkout করুন</a>
      <a href="listing.html" class="btn btn-ghost btn-md" style="width:100%;justify-content:center;margin-top:8px;">← কেনাকাটা চালিয়ে যান</a>
    </div>
  </div>
</div>

<!-- Mobile NAV -->
<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="index.html" class="mobile-nav-item"><span class="mobile-nav-icon">🏠</span><span class="mobile-nav-label">হোম</span></a>
    <a href="listing.html" class="mobile-nav-item"><span class="mobile-nav-icon">🔍</span><span class="mobile-nav-label">খুঁজুন</span></a>
    <a href="cart.html" class="mobile-nav-cart active"><div class="mobile-nav-cart-inner" style="background:var(--accent);">🛒</div></a>
    <a href="seller-dashboard.html" class="mobile-nav-item"><span class="mobile-nav-icon">🏪</span><span class="mobile-nav-label">দোকান</span></a>
    <a href="#" class="mobile-nav-item" onclick="showAuthModal();return false;"><span class="mobile-nav-icon">👤</span><span class="mobile-nav-label">প্রোফাইল</span></a>
  </div>
</nav>

<!-- AUTH MODAL -->
<div class="modal-backdrop hidden" id="auth-modal">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="hideAuthModal()">✕</button>
    <div class="modal-header"><div class="modal-logo">Bazar<span>e</span></div><div class="modal-title">লগইন করুন</div><div class="modal-sub" id="auth-hint">Checkout করতে লগইন প্রয়োজন</div></div>
    <div class="modal-body auth-step" id="auth-step-main">
      <button class="auth-btn" onclick="loginWithGoogle()"><div class="auth-btn-icon" style="background:white;border:1px solid #e0e0e0;"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></div>Google দিয়ে লগইন</button>
      <div class="auth-divider">অথবা</div>
      <button class="auth-btn" onclick="showAuthStep('phone-enter')"><div class="auth-btn-icon" style="background:var(--green);color:white;font-size:16px;">📱</div>ফোন নম্বর দিয়ে লগইন</button>
    </div>
    <div class="modal-body auth-step hidden" id="auth-step-phone-enter">
      <button class="btn btn-ghost btn-sm" onclick="showAuthStep('main')" style="align-self:flex-start;">← ফিরে যান</button>
      <div class="input-group"><label class="input-label">ফোন নম্বর</label><input class="input-field" type="tel" id="phone-input" placeholder="01XXXXXXXXX" maxlength="11"></div>
      <button class="btn btn-primary btn-lg" id="send-otp-btn" onclick="sendOTP()" style="width:100%">OTP পাঠান</button>
      <div id="recaptcha-container"></div>
    </div>
    <div class="modal-body auth-step hidden" id="auth-step-phone-otp">
      <button class="btn btn-ghost btn-sm" onclick="showAuthStep('phone-enter')" style="align-self:flex-start;">← ফিরে যান</button>
      <p style="font-size:14px;color:var(--gray-500);text-align:center;"><span id="otp-sent-to"></span> তে OTP</p>
      <div class="otp-row"><input class="otp-input" type="text" maxlength="1" inputmode="numeric"><input class="otp-input" type="text" maxlength="1" inputmode="numeric"><input class="otp-input" type="text" maxlength="1" inputmode="numeric"><input class="otp-input" type="text" maxlength="1" inputmode="numeric"><input class="otp-input" type="text" maxlength="1" inputmode="numeric"><input class="otp-input" type="text" maxlength="1" inputmode="numeric"></div>
      <button class="btn btn-primary btn-lg" id="verify-otp-btn" onclick="verifyOTP()" style="width:100%;margin-top:8px;">নিশ্চিত করুন</button>
    </div>
    <div class="modal-footer"><p>লগইন করে আমাদের <a href="#" style="color:var(--green);">Terms</a>-তে সম্মত হচ্ছেন।</p></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="cart.js"></script>
<script>
const emojiBg = {'👗':'#fce7f3','🌿':'#d1fae5','🧴':'#fef3c7','🌸':'#ede9fe','🥚':'#fef3c7','🦜':'#dbeafe','🍯':'#ffedd5','🧶':'#fce7f3','🪴':'#d1fae5','🎁':'#fee2e2'};

document.addEventListener('DOMContentLoaded', renderCart);

function renderCart() {
  const cart = getCart();
  const container = document.getElementById('cart-container');
  const summary   = document.getElementById('cart-summary');

  if (!cart.length) {
    container.innerHTML = `<div class="cart-empty">
      <div class="cart-empty-icon">🛒</div>
      <h2>কার্ট খালি</h2>
      <p>এখনও কোনো পণ্য যোগ করেননি</p>
      <a href="listing.html" class="btn btn-primary btn-lg">🛍️ কেনাকাটা শুরু করুন</a>
    </div>`;
    summary.style.display = 'none';
    return;
  }

  summary.style.display = 'block';

  container.innerHTML = `<div class="cart-items">
    ${cart.map(item => `
    <div class="cart-item" id="cart-item-${item.id}">
      <div class="cart-item-img" style="background:${item.imageUrl ? '' : (emojiBg[item.emoji]||'#e8f5ed')}">
        ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}">` : `<span style="font-size:36px;">${item.emoji||'📦'}</span>`}
      </div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-seller">Bazare Seller</div>
        <div class="cart-item-price">৳${item.price.toLocaleString('bn')}</div>
      </div>
      <div class="cart-item-qty">
        <button class="qty-btn-sm" onclick="changeItemQty('${item.id}', -1)">−</button>
        <input class="qty-num-sm" type="number" value="${item.qty||1}" min="1" onchange="setItemQty('${item.id}', parseInt(this.value))">
        <button class="qty-btn-sm" onclick="changeItemQty('${item.id}', 1)">+</button>
      </div>
      <div style="font-weight:800;font-family:var(--font-heading);font-size:16px;color:var(--green);min-width:80px;text-align:right;">৳${(item.price*(item.qty||1)).toLocaleString('bn')}</div>
      <button class="cart-item-remove" onclick="removeItem('${item.id}')">🗑</button>
    </div>`).join('')}
  </div>`;

  updateSummary();
}

function changeItemQty(id, delta) {
  const cart = getCart();
  const item = cart.find(i => i.id === id);
  if (!item) return;
  const newQty = (item.qty||1) + delta;
  if (newQty <= 0) { removeItem(id); return; }
  item.qty = newQty;
  saveLocalCart(cart);
  renderCart();
}

function setItemQty(id, qty) {
  if (qty <= 0) { removeItem(id); return; }
  updateQty(id, qty);
  renderCart();
}

function removeItem(id) {
  removeFromCart(id);
  renderCart();
  showToast('পণ্য কার্ট থেকে সরানো হয়েছে', 'info');
}

function updateSummary() {
  const cart     = getCart();
  const subtotal = cart.reduce((s,i) => s + (i.price*(i.qty||1)), 0);
  const delivery = subtotal > 999 ? 0 : 60;
  const total    = subtotal + delivery;

  document.getElementById('subtotal').textContent    = '৳' + subtotal.toLocaleString('bn');
  document.getElementById('delivery-fee').textContent = delivery === 0 ? 'Free 🎉' : '৳' + delivery;
  document.getElementById('total-amount').textContent = '৳' + total.toLocaleString('bn');
}

function applyCoupon() {
  const code = document.getElementById('coupon-input').value.trim().toUpperCase();
  const coupons = { 'BAZARE10': 10, 'NEWUSER20': 20 };
  if (coupons[code]) {
    showToast(`✅ ${coupons[code]}% ছাড় প্রযোজ্য হয়েছে!`, 'success');
    document.getElementById('discount-row').style.display = 'flex';
    document.getElementById('discount-amount').style.display = 'block';
    const discount = Math.round(getCartTotal() * coupons[code] / 100);
    document.getElementById('discount-row').textContent = `-${coupons[code]}% ছাড়`;
    document.getElementById('discount-amount').textContent = '-৳' + discount.toLocaleString('bn');
  } else {
    showToast('❌ Invalid coupon code', 'error');
  }
}
</script>
</body>
</html>
