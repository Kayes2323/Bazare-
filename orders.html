<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার অর্ডার — Bazare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .orders-page { max-width: 900px; margin: 0 auto; padding: 28px 24px; padding-bottom: 100px; }
    .page-title { font-family: var(--font-heading); font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .page-sub { font-size: 14px; color: var(--gray-500); margin-bottom: 24px; }

    /* Tabs */
    .order-tabs { display: flex; gap: 4px; background: var(--gray-100); padding: 4px; border-radius: 12px; margin-bottom: 24px; overflow-x: auto; }
    .order-tab { flex-shrink: 0; padding: 9px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: var(--gray-500); font-family: var(--font-body); transition: all 0.2s; }
    .order-tab.active { background: white; color: var(--green); box-shadow: var(--shadow-xs); }

    /* Order card */
    .order-card { background: white; border-radius: 16px; border: 1px solid var(--gray-100); margin-bottom: 14px; overflow: hidden; transition: all 0.2s; box-shadow: var(--shadow-xs); }
    .order-card:hover { box-shadow: var(--shadow-md); border-color: var(--green-pale2); }

    .order-card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--gray-100); flex-wrap: wrap; gap: 8px; }
    .order-id { font-family: var(--font-heading); font-size: 14px; font-weight: 800; color: var(--black); }
    .order-date { font-size: 12px; color: var(--gray-400); }
    .order-status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; }
    .st-pending   { background: #fffff0; color: #d69e2e; border: 1px solid #f6e05e; }
    .st-confirmed { background: var(--green-pale); color: var(--green); border: 1px solid var(--green-pale2); }
    .st-shipped   { background: #ebf8ff; color: #3182ce; border: 1px solid #bee3f8; }
    .st-delivered { background: #faf5ff; color: #6b46c1; border: 1px solid #d6bcfa; }
    .st-cancelled { background: var(--red-light); color: var(--red); border: 1px solid #fed7d7; }

    .order-card-body { padding: 16px 18px; }
    .order-items-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .order-item-img { width: 60px; height: 60px; border-radius: 10px; background: var(--gray-50); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--gray-100); }
    .order-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .order-item-info { flex: 1; }
    .order-item-name { font-family: var(--font-heading); font-size: 14px; font-weight: 700; color: var(--black); margin-bottom: 3px; }
    .order-item-meta { font-size: 12px; color: var(--gray-400); }
    .order-item-price { font-size: 16px; font-weight: 800; color: var(--green); font-family: var(--font-heading); }

    .order-card-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: var(--gray-50); border-top: 1px solid var(--gray-100); flex-wrap: wrap; gap: 8px; }
    .order-total { font-size: 15px; font-weight: 700; color: var(--black); }
    .order-total span { color: var(--green); font-family: var(--font-heading); font-size: 18px; }
    .order-actions { display: flex; gap: 8px; }
    .order-action-btn { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: var(--font-body); border: 1.5px solid var(--gray-200); background: white; color: var(--gray-700); }
    .order-action-btn:hover { border-color: var(--green); color: var(--green); }
    .order-action-btn.primary { background: var(--green); color: white; border-color: var(--green); }
    .order-action-btn.primary:hover { background: var(--green-dark); }
    .order-action-btn.danger { border-color: var(--red); color: var(--red); }
    .order-action-btn.danger:hover { background: var(--red); color: white; }

    /* Tracking timeline */
    .tracking-timeline { padding: 0 18px 16px; display: none; }
    .tracking-timeline.show { display: block; animation: fadeUp 0.3s ease; }
    .timeline { display: flex; flex-direction: column; gap: 0; position: relative; padding-left: 28px; }
    .timeline::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--gray-200); }
    .timeline-item { display: flex; align-items: flex-start; gap: 14px; padding: 8px 0; position: relative; }
    .timeline-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; position: absolute; left: -28px; }
    .timeline-dot.done { background: var(--green); color: white; }
    .timeline-dot.current { background: var(--accent); color: #000; box-shadow: 0 0 0 4px rgba(240,180,41,0.2); }
    .timeline-dot.pending { background: var(--gray-200); color: var(--gray-400); }
    .timeline-content { flex: 1; }
    .timeline-label { font-size: 14px; font-weight: 700; color: var(--black); }
    .timeline-label.pending { color: var(--gray-400); }
    .timeline-time { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

    /* Empty state */
    .orders-empty { text-align: center; padding: 80px 20px; }
    .orders-empty-icon { font-size: 64px; margin-bottom: 16px; }
    .orders-empty h2 { font-family: var(--font-heading); font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .orders-empty p { font-size: 15px; color: var(--gray-500); margin-bottom: 24px; }

    /* Review modal */
    .review-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .review-modal-backdrop.hidden { display: none; }
    .review-modal { background: white; border-radius: 20px; width: 100%; max-width: 440px; padding: 28px; box-shadow: var(--shadow-xl); animation: scaleIn 0.3s ease; }
    .star-select { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
    .star-btn { font-size: 32px; cursor: pointer; transition: transform 0.1s; background: none; border: none; filter: grayscale(1); }
    .star-btn.active { filter: none; transform: scale(1.1); }

    @media (max-width: 768px) {
      .orders-page { padding: 16px; }
      .order-card-footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<script>
let allOrders = [];
let currentFilter = 'all';
let reviewOrderId = '';
let selectedStars = 0;
const emojiBg = {'👗':'#fce7f3','🌿':'#d1fae5','🧴':'#fef3c7','🌸':'#ede9fe','🥚':'#fef3c7','🦜':'#dbeafe','🍯':'#ffedd5','🧶':'#fce7f3','🪴':'#d1fae5','🎁':'#fee2e2'};

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    showAuthModal('অর্ডার দেখতে লগইন করুন');
    return;
  }
  loadOrders(user.uid);
});

async function loadOrders(uid) {
  try {
    const snap = await db.collection(COL.ORDERS)
      .where('buyerId', '==', uid)
      .get();
    // Sort locally
    allOrders.sort((a,b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('orders-count').textContent = `মোট ${allOrders.length}টি অর্ডার`;
    renderOrders(allOrders);
  } catch(e) {
    document.getElementById('orders-container').innerHTML = `<div style="text-align:center;padding:60px;color:var(--gray-400);">অর্ডার লোড করতে সমস্যা হয়েছে।</div>`;
  }
}

function filterOrders(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const filtered = status === 'all' ? allOrders : allOrders.filter(o => o.status === status);
  renderOrders(filtered);
}

function renderOrders(orders) {
  const container = document.getElementById('orders-container');

  if (!orders.length) {
    container.innerHTML = `<div class="orders-empty">
      <div class="orders-empty-icon">📦</div>
      <h2>কোনো অর্ডার নেই</h2>
      <p>${currentFilter === 'all' ? 'এখনও কোনো অর্ডার করেননি।' : `কোনো ${currentFilter} অর্ডার নেই।`}</p>
      <a href="listing.html" class="btn btn-primary btn-lg">🛍️ কেনাকাটা শুরু করুন</a>
    </div>`;
    return;
  }

  container.innerHTML = orders.map(order => buildOrderCard(order)).join('');
}

function buildOrderCard(o) {
  const sid = o.id.slice(-6).toUpperCase();
  const statusMap = {
    pending:   { label: '⏳ Pending',   cls: 'st-pending' },
    confirmed: { label: '✅ Confirmed', cls: 'st-confirmed' },
    shipped:   { label: '🚚 Shipped',   cls: 'st-shipped' },
    delivered: { label: '🎉 Delivered', cls: 'st-delivered' },
    cancelled: { label: '❌ Cancelled', cls: 'st-cancelled' },
  };
  const st = statusMap[o.status] || statusMap.pending;
  const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString('bn-BD', { day:'numeric', month:'long', year:'numeric' }) : '';

  const items = o.items || [{ name: o.productName, emoji: '📦', price: o.total }];

  const itemsHtml = items.map(item => `
    <div class="order-items-row">
      <div class="order-item-img" style="background:${item.imageUrl ? '' : (emojiBg[item.emoji]||'#e8f5ed')}">
        ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}">` : (item.emoji||'📦')}
      </div>
      <div class="order-item-info">
        <div class="order-item-name">${item.name}</div>
        <div class="order-item-meta">পরিমাণ: ${item.qty||1} · ${o.paymentMethod === 'cod' ? 'Cash on Delivery' : o.paymentMethod}</div>
      </div>
      <div class="order-item-price">৳${(item.price*(item.qty||1)).toLocaleString('bn')}</div>
    </div>`).join('');

  const trackingSteps = getTrackingSteps(o.status);

  return `
  <div class="order-card" id="order-${o.id}">
    <div class="order-card-header">
      <div>
        <div class="order-id">#BZ-${sid}</div>
        <div class="order-date">${date}</div>
      </div>
      <span class="order-status-badge ${st.cls}">${st.label}</span>
    </div>
    <div class="order-card-body">
      ${itemsHtml}
    </div>
    <!-- Tracking timeline -->
    <div class="tracking-timeline" id="tracking-${o.id}">
      <div style="font-size:13px;font-weight:700;color:var(--gray-600);margin-bottom:12px;">📍 অর্ডার ট্র্যাকিং</div>
      <div class="timeline">
        ${trackingSteps.map(step => `
          <div class="timeline-item">
            <div class="timeline-dot ${step.state}">${step.state === 'done' ? '✓' : step.state === 'current' ? '●' : '○'}</div>
            <div class="timeline-content">
              <div class="timeline-label ${step.state === 'pending' ? 'pending' : ''}">${step.label}</div>
              ${step.time ? `<div class="timeline-time">${step.time}</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="order-card-footer">
      <div class="order-total">মোট: <span>৳${(o.total||0).toLocaleString('bn')}</span></div>
      <div class="order-actions">
        <button class="order-action-btn" onclick="toggleTracking('${o.id}')">📍 ট্র্যাক করুন</button>
        ${o.status === 'delivered' ? `<button class="order-action-btn primary" onclick="openReviewModal('${o.id}', '${items[0]?.name||'পণ্য'}')">⭐ রিভিউ দিন</button>` : ''}
        ${o.status === 'delivered' ? `<button class="order-action-btn" onclick="reorder('${o.id}')">🔄 আবার অর্ডার</button>` : ''}
        ${o.status === 'pending' ? `<button class="order-action-btn danger" onclick="cancelOrder('${o.id}')">❌ বাতিল করুন</button>` : ''}
        <a href="product.html?id=${items[0]?.id||''}" class="order-action-btn">🛍️ পণ্য দেখুন</a>
      </div>
    </div>
  </div>`;
}

function getTrackingSteps(status) {
  const steps = [
    { key: 'pending',   label: '✅ অর্ডার দেওয়া হয়েছে' },
    { key: 'confirmed', label: '📋 Seller confirm করেছেন' },
    { key: 'shipped',   label: '🚚 পণ্য পাঠানো হয়েছে' },
    { key: 'delivered', label: '🎉 পণ্য পৌঁছে গেছে' },
  ];
  const order = ['pending', 'confirmed', 'shipped', 'delivered'];
  const currentIdx = order.indexOf(status);

  return steps.map((step, i) => ({
    ...step,
    state: i < currentIdx ? 'done' : i === currentIdx ? 'current' : 'pending',
    time: i <= currentIdx ? '' : '',
  }));
}

function toggleTracking(orderId) {
  const el = document.getElementById('tracking-' + orderId);
  el.classList.toggle('show');
}

async function cancelOrder(orderId) {
  if (!confirm('এই অর্ডার বাতিল করবেন?')) return;
  try {
    await db.collection(COL.ORDERS).doc(orderId).update({ status: 'cancelled', cancelledAt: firebase.firestore.FieldValue.serverTimestamp() });
    showToast('অর্ডার বাতিল হয়েছে', 'info');
    loadOrders(currentUser.uid);
  } catch(e) {
    showToast('❌ সমস্যা হয়েছে', 'error');
  }
}

async function reorder(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (!order?.items) return;
  order.items.forEach(item => {
    addToCart({ id: item.id||orderId, name: item.name, price: item.price, emoji: item.emoji||'📦', imageUrl: item.imageUrl||'' }, null);
  });
  showToast('✅ পণ্য কার্টে যোগ হয়েছে', 'success');
  setTimeout(() => window.location.href = 'cart.html', 1200);
}

// ── Review ──
function openReviewModal(orderId, productName) {
  reviewOrderId = orderId;
  selectedStars = 0;
  document.getElementById('review-product-name').textContent = productName;
  document.getElementById('review-text').value = '';
  document.getElementById('star-label').textContent = 'রেটিং দিন';
  document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('review-modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeReviewModal() {
  document.getElementById('review-modal').classList.add('hidden');
  document.body.style.overflow = '';
}

function selectStar(n) {
  selectedStars = n;
  const labels = ['', 'খুবই খারাপ', 'খারাপ', 'ঠিকঠাক', 'ভালো', 'চমৎকার!'];
  document.getElementById('star-label').textContent = labels[n];
  document.querySelectorAll('.star-btn').forEach((b, i) => {
    b.classList.toggle('active', i < n);
  });
}

async function submitReview() {
  if (!selectedStars) { showToast('রেটিং দিন', 'error'); return; }
  const comment = document.getElementById('review-text').value.trim();
  const order   = allOrders.find(o => o.id === reviewOrderId);

  try {
    await db.collection('reviews').add({
      orderId:   reviewOrderId,
      productId: order?.items?.[0]?.id || '',
      buyerId:   currentUser.uid,
      userName:  currentProfile?.name || currentUser.displayName || 'ক্রেতা',
      rating:    selectedStars,
      comment,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });

    // Update product rating
    if (order?.items?.[0]?.id) {
      const pSnap = await db.collection(COL.PRODUCTS).doc(order.items[0].id).get();
      if (pSnap.exists) {
        const p = pSnap.data();
        const newCount  = (p.reviewCount || 0) + 1;
        const newRating = ((p.rating || 0) * (p.reviewCount || 0) + selectedStars) / newCount;
        await db.collection(COL.PRODUCTS).doc(order.items[0].id).update({ rating: newRating, reviewCount: newCount });
      }
    }

    closeReviewModal();
    showToast('✅ রিভিউ জমা হয়েছে! ধন্যবাদ।', 'success');
  } catch(e) {
    showToast('❌ রিভিউ জমা দিতে সমস্যা হয়েছে', 'error');
  }
}

document.getElementById('review-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('review-modal')) closeReviewModal();
});
</script>
